name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating wrapper..."
            gradle wrapper --gradle-version 9.3.1 || gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --stacktrace

      - name: 7. Renomear e Organizar APK de saída
        run: |
          mkdir -p dist-apk
          APK_PATH=""
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            APK_PATH=$(find app/build/outputs/apk/ -type f -name "*.apk" -print -quit)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: No APK found in app/build/outputs/apk/"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "dist-apk/Sudoku_Master-debug.apk"
          cp "$APK_PATH" "dist-apk/Sudoku_Master.apk"
          echo "Successfully copied APK to dist-apk/"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku_Master-debug
          path: dist-apk/Sudoku_Master-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/Sudoku_Master-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
